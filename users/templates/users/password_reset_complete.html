{% extends 'header.html' %}
{% load static %}

{% block content %}
<!-- Контейнер-обертка для центрирования на весь экран -->
<div class="login-wrapper"
     style="display: flex; justify-content: center; align-items: center; min-height: 80vh; width: 100%; padding: 40px 20px; background-color: #f8f9fa; box-sizing: border-box;">

    <!-- Карточка уведомления -->
    <div class="login-container"
         style="background-color: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); width: 100%; max-width: 440px; border-top: 5px solid #28a745; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center;">

        <!-- ИСПРАВЛЕНО: Индикатор со встроенным SVG открытого замка (не требует FontAwesome) -->
        <div style="width: 64px; height: 64px; background-color: #d4edda; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px;">
            <svg xmlns="http://w3.org" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
            </svg>
        </div>
        <!-- Заголовок -->
        <h2 style="margin-bottom: 15px; color: #2d3748; font-size: 22px; font-weight: 700;">Пароль успешно изменен!</h2>

        <!-- Текст сообщения -->
        <p style="color: #718096; font-size: 15px; line-height: 1.6; margin-bottom: 30px;">
            Ваш новый пароль успешно сохранён в системе. Теперь вы можете войти в свой личный кабинет, используя новые учётные данные.
        </p>
        <!-- Кнопка перехода сразу на страницу входа -->
        <a href="{% url 'users:login' %}"
           style="display: block; width: 100%; padding: 14px; background-color: #e60000; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background-color 0.2s ease; box-shadow: 0 4px 6px rgba(230, 0, 0, 0.1); box-sizing: border-box;"
           onmouseover="this.style.backgroundColor='#b30000';"
           onmouseout="this.style.backgroundColor='#e60000';">
            Войти в личный кабинет
        </a>
    </div>
</div>

{% endblock %}

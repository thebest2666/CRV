{% extends 'header.html' %}
{% load static %}

{% block content %}
<div style="max-width: 700px; margin: 40px auto; padding: 35px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); font-family: sans-serif; box-sizing: border-box;">

    <h2 style="margin-top: 0; color: #2d3748; font-size: 24px; font-weight: 800; border-bottom: 2px solid #edf2f7; padding-bottom: 12px; margin-bottom: 20px;">
        Профиль пользователя
    </h2>

    <!-- Системные уведомления (Messages) -->
    {% if messages %}
    {% for message in messages %}
    <div style="padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; font-weight: 600;
                {% if message.tags == 'error' %} background-color: #fff5f5; color: #c53030; border: 1px solid #fed7d7;
                {% else %} background-color: #f0fff4; color: #22543d; border: 1px solid #c6f6d5; {% endif %}">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    <form action="{% url 'users:profile' %}" method="POST" style="margin: 0;">
        {% csrf_token %}

        <!-- Двухколоночный ряд: Имя и Фамилия -->
        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #4a5568;">Имя</label>
                <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="Имя"
                       style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
            </div>
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #4a5568;">Фамилия</label>
                <input type="text" name="last_name" value="{{ user.last_name }}" placeholder="Фамилия"
                       style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
            </div>
        </div>

        <!-- Двухколоночный ряд: Email и Телефон -->
        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #4a5568;">Электронная почта *</label>
                <input type="email"
                       name="email"
                       value="{{ user.email|default:'' }}"
                       required
                       pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(ru|com|net|org|info|biz)$"
                       title="Введите корректный адрес электронной почты. В конце домена не должно быть цифр (например: .ru, .com)"
                       style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.15s ease;"
                       oninput="this.value = this.value.toLowerCase().trim();">
            </div>
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #334155;">Контактный телефон *</label>
                <input type="tel"
                       name="phone"
                       value="{{ user.phone.as_e164|default:user.phone|default:'' }}"
                       placeholder="+79504251780"
                       required
                       pattern="^\+7[0-9]{10}$"
                       title="Номер телефона должен быть в формате +7 и 10 цифр после него. Пример: +79501234567"
                       style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.15s ease;"
                       oninput="let v = this.value.replace(/[^\d+]/g, ''); if(!v.startsWith('+7')) v = '+7' + v.replace(/[^\d]/g, ''); this.value = v.substring(0, 12);">
            </div>
        </div>
        <!-- Название компании -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #4a5568;">Название Вашей компании (Организация)</label>
            <input type="text" name="company" value="{{ user.company|default:'' }}"
                   placeholder="ООО, ИП или название компании"
                   style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
        </div>

        <!-- Город -->
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: #4a5568;">Город</label>
            <input type="text" name="city" value="{{ user.city|default:'' }}"
                   placeholder="Например: Иркутск, Ангарск, Братск"
                   style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
        </div>
        <!-- Кнопка действия -->
        <button type="submit"
                style="width: 100%; padding: 14px; background-color: #e60000; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background-color 0.2s;"
                onmouseover="this.style.backgroundColor='#b30000'"
                onmouseout="this.style.backgroundColor='#e60000'">
            Сохранить карточку профиля
        </button>
    </form>
</div>

{% endblock %}

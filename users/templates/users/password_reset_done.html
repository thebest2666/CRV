{% extends 'header.html' %}
{% load static %}

{% block content %}
<!-- Контейнер-обертка для центрирования на весь экран -->
<div class="login-wrapper"
     style="display: flex; justify-content: center; align-items: center; min-height: 80vh; width: 100%; padding: 40px 20px; background-color: #f8f9fa; box-sizing: border-box;">

    <!-- Карточка уведомления -->
    <div class="login-container"
         style="background-color: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); width: 100%; max-width: 440px; border-top: 5px solid #28a745; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center;">

        <!-- ИСПРАВЛЕНО: Круглая зеленая плашка со встроенной SVG-галочкой (не требует FontAwesome) -->
        <div style="width: 64px; height: 64px; background-color: #d4edda; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px;">
            <svg xmlns="http://w3.org" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <!-- Заголовок -->
        <h2 style="margin-bottom: 15px; color: #2d3748; font-size: 22px; font-weight: 700;">Письмо отправлено!</h2>

        <!-- Текст сообщения -->
        <p style="color: #718096; font-size: 15px; line-height: 1.6; margin-bottom: 12px;">
            Мы отправили вам на почту инструкции по восстановлению доступа к личному кабинету.
        </p>

        <!-- Подсказка о фильтрации почты -->
        <p style="color: #a0aec0; font-size: 13px; line-height: 1.5; margin-bottom: 30px; background-color: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px dashed #e2e8f0; margin-left: 0; margin-right: 0; box-sizing: border-box;">
            Если письмо не приходит в течение пары минут, обязательно проверьте папку <strong>«Спам»</strong>.
        </p>
        <!-- Кнопка возврата на главную -->
        <a href="/"
           style="display: block; width: 100%; padding: 14px; background-color: #333333; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background-color 0.2s ease; box-sizing: border-box;"
           onmouseover="this.style.backgroundColor='#1a1a1a';"
           onmouseout="this.style.backgroundColor='#333333';">
            Вернуться на главную
        </a>
    </div>
</div>

{% endblock %}
